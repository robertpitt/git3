name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: git verify-tag "$GITHUB_REF_NAME" && test -z "$(gofmt -l .)" && go test -race ./... && go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.6.1 && staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  build:
    needs: test
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: Build deterministic archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildTime=$(date -u -d @${SOURCE_DATE_EPOCH} +%Y-%m-%dT%H:%M:%SZ) -X main.dirty=false" -o dist/git3 ./cmd/git3
          cp LICENSE NOTICE dist/
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C dist -cf - git3 LICENSE NOTICE | gzip -n > "git3_${VERSION#v}_${GOOS}_${GOARCH}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: git3-${{ matrix.os }}-${{ matrix.arch }}
          path: git3_*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'git3-*', merge-multiple: true}
      - run: sha256sum git3_*.tar.gz | sort -k2 > checksums.txt
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - run: for f in git3_*.tar.gz; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/attest-build-provenance@v2
        with: {subject-path: 'git3_*.tar.gz'}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes git3_*.tar.gz *.sigstore.json checksums.txt install.sh
